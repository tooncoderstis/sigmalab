name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sigmalab
          POSTGRES_PASSWORD: sigmalab
          POSTGRES_DB: sigmalab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sigmalab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://sigmalab:sigmalab@localhost:5432/sigmalab_test
      AUTH_SECRET: ci-secret-not-used-in-production
      MAYAR_BASE_URL: https://api.mayar.io/hl/v2
      MAYAR_API_KEY: ci-dummy-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E test
        run: npm run test:e2e
